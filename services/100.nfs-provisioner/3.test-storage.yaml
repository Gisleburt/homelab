# This file is not automatically installed, it exists to help test the nfs service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-claim
  namespace: storage
spec:
  storageClassName: nfs-storageclass-ephemeral
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-tester
  labels:
    app.kubernetes.io/name: nfs-tester
  namespace: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-tester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-tester
    spec:
      initContainers:
        - name: init-files
          image: busybox:1.28
          command: ["sh", "-c", "touch /test-area/test-file"]
          volumeMounts:
            - mountPath: /test-area
              name: test-claim
      containers:
        - name: nfs-tester
          image: alpine
          command: ["sh", "-c", "while true; do ls /test-area; sleep 10; done"]
          volumeMounts:
            - mountPath: /test-area
              name: test-claim
      volumes:
        - name: test-claim
          persistentVolumeClaim:
            claimName: test-claim
