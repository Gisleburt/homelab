---
# tasks file for k3s-agents
- name: Download
  get_url:
    dest: ~/k3s
    url: https://get.k3s.io
  tags:
    - always

- name: Set execute permission
  file:
    path: ~/k3s
    mode: u+x
  tags:
    - always

- name: start agents
  shell: ~/k3s agent --server https://{{ hostvars[groups['primary_server'][0]]['ip_address'] }}:6443 --token {{ hostvars[groups['primary_server'][0]]['node_token'] | b64decode }}
  tags:
    - always
